<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A-L-E-S-S-A : Initializing</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      background-color: #e0e5ec; 
      display: flex; justify-content: center; align-items: center;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .fluid-container {
      position: relative; width: 350px; height: 350px;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
    }
    .fluid-shape {
      position: absolute; width: 100%; height: 100%;
      background: linear-gradient(135deg, #f0f5fa, #cbd2db);
      box-shadow: 15px 15px 35px rgba(163, 177, 198, 0.6), -15px -15px 35px rgba(255, 255, 255, 0.8);
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      animation: morph 8s ease-in-out infinite, spin 15s linear infinite;
      z-index: 1;
    }
    .fluid-shape:nth-child(2) {
      background: linear-gradient(135deg, #e6ebf2, #d0d7e3);
      animation-direction: reverse; animation-duration: 12s; opacity: 0.8;
      box-shadow: inset 5px 5px 15px rgba(163, 177, 198, 0.3), inset -5px -5px 15px rgba(255, 255, 255, 0.5);
      z-index: 2;
    }
    .fluid-shape:nth-child(3) {
      background: transparent; border: 1.5px solid rgba(255, 255, 255, 0.6); box-shadow: none; animation-duration: 20s; z-index: 3;
    }
    .core-text { position: relative; z-index: 10; text-align: center; }
    .core-text h1 {
      font-size: 13px; letter-spacing: 10px; text-transform: uppercase; margin: 0; font-weight: 600; color: #8a9ba8;
      animation: pulse-text 3s ease-in-out infinite;
    }
    @keyframes morph {
      0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
      34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
      67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse-text { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; color: #5a758c; } }
  </style>
</head>
<body onclick="launchGame()">
  <div class="fluid-container">
    <div class="fluid-shape"></div>
    <div class="fluid-shape"></div>
    <div class="fluid-shape"></div>
    <div class="core-text"><h1>[ CLICK TO INITIALIZE ]</h1></div>
  </div>
  <script>
    function launchGame() {
      window.location.href = "Index.html";
    }
  </script>
</body>
</html>
