<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A-L-E-S-S-A : Audio Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      background-color: #020108; display: flex; justify-content: center; align-items: center; overflow: hidden; color: white;
    }
    .screen {
      width: 100%; height: 100%; justify-content: center; align-items: center; flex-direction: column;
      position: absolute; top: 0; left: 0; display: flex; opacity: 0; visibility: hidden; transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
    }
    .screen.active { opacity: 1; visibility: visible; }

    /* --- START OVERLAY (Fixes browser audio block) --- */
    #start-overlay {
      position: absolute; inset: 0; background-color: #020108; z-index: 100;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      transition: opacity 0.5s ease;
    }
    .pulse-prompt {
      font-family: 'Orbitron', sans-serif; font-size: 20px; color: #00f0ff; letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8); animation: pulse-text 2s infinite;
    }
    @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* --- CYBERPUNK MATRIX BACKGROUND --- */
    body::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 10;
    }
    .cyber-matrix {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); grid-auto-rows: 32px;
      font-size: 22px; font-family: "Courier New", Courier, monospace; font-weight: bold; color: rgba(0, 255, 204, 0.15);
      justify-content: center; align-content: center; z-index: 0; overflow: hidden;
    }
    .cyber-matrix > span { text-align: center; text-shadow: 0 0 2px rgba(0, 255, 204, 0.2); user-select: none; line-height: 1.2; transform: translateZ(0); will-change: color; }

    .cyber-matrix > span:nth-child(19n + 2) { animation: cyber-pulse 3.5s infinite 0.2s; }
    .cyber-matrix > span:nth-child(29n + 1) { animation: cyber-pulse 4.1s infinite 0.7s; }
    .cyber-matrix > span:nth-child(11n)     { animation: cyber-pulse 2.9s infinite 1.1s; color: rgba(255, 0, 255, 0.2); }
    .cyber-matrix > span:nth-child(37n + 10){ animation: cyber-pulse 5.3s infinite 1.5s; }
    .cyber-matrix > span:nth-child(41n + 1) { animation: cyber-pulse 3.9s infinite 0.4s; }
    .cyber-matrix > span:nth-child(17n + 9) { animation: glitch-pulse 2.8s infinite 0.9s; } 
    .cyber-matrix > span:nth-child(23n + 18){ animation: cyber-pulse 4.3s infinite 1.3s; }
    .cyber-matrix > span:nth-child(31n + 4) { animation: cyber-pulse 5.6s infinite 0.1s; }
    .cyber-matrix > span:nth-child(43n + 20){ animation: glitch-pulse 3.6s infinite 1.8s; }
    .cyber-matrix > span:nth-child(13n + 6) { animation: cyber-pulse 3.2s infinite 1.2s; }

    @keyframes cyber-pulse {
      0%, 100% { color: rgba(0, 255, 204, 0.15); text-shadow: 0 0 2px rgba(0, 255, 204, 0.3); }
      30% { color: #00ffcc; text-shadow: 0 0 8px #00ffcc, 0 0 15px #00ffcc; }
      50% { color: #ff00ff; text-shadow: 0 0 8px #ff00ff, 0 0 15px #ff00ff; }
      70% { color: #ffffff; text-shadow: 0 0 5px #fff, 0 0 10px #00ffcc; }
    }
    @keyframes glitch-pulse {
      0%, 100% { opacity: 1; color: rgba(255, 0, 85, 0.15); }
      48% { opacity: 1; color: #ff0055; text-shadow: 0 0 10px #ff0055; }
      50% { opacity: 0.1; } 
      52% { opacity: 1; color: #fff; text-shadow: -3px 0 #00ffcc, 3px 0 #ff00ff; } 
      54% { opacity: 0.2; }
      56% { opacity: 1; color: #00ffcc; }
    }

    /* Transition Screen & Valve Design */
    #transition-screen {
      font-family: 'Orbitron', sans-serif; background: linear-gradient(to bottom, #05050a 0%, #0a0a12 50%, #020108 100%); z-index: 50;
    }
    #rain-container { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .rain-stream {
      position: absolute; top: -100%; writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap;
      font-size: 20px; font-weight: bold; letter-spacing: 8px; opacity: 0; animation: fall linear forwards;
    }
    .color-cyan { color: rgba(0, 240, 255, 0.4); text-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }
    .color-magenta { color: rgba(255, 0, 85, 0.4); text-shadow: 0 0 5px rgba(255, 0, 85, 0.5); }
    .color-white { color: rgba(255, 255, 255, 0.3); text-shadow: 0 0 5px rgba(255, 255, 255, 0.6); }
    @keyframes fall { 0% { top: -50%; opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { top: 120%; opacity: 0; } }
    
    @keyframes cyberSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff; border-color: #00f0ff; }
      20%, 24%, 55% { box-shadow: 0 0 2px #005577, inset 0 0 2px #005577; border-color: #005577; }
    }

    .original-valve {
      width: 130px; height: 130px; border: 4px dashed #00f0ff; border-radius: 50%; position: relative;
      animation: cyberSpin 1.5s linear infinite, neonFlicker 4s infinite;
    }
    .spin-jammed {
      animation: none !important; border-color: #ff0055 !important; box-shadow: 0 0 20px #ff0055, inset 0 0 15px #ff0055 !important;
    }
    
    #transition-content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #transition-text { font-size: 32px; color: #00f0ff; text-shadow: 0 0 15px #00f0ff; margin-top: 40px; letter-spacing: 4px; }

    /* Main Game UI */
    #game-screen, #end-screen { font-family: 'Copperplate Gothic', 'Copperplate', serif; z-index: 20; }
    .glass-container {
      width: 700px; min-height: 400px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      background: rgba(15, 15, 20, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5); text-align: center;
    }
    .status-bar { width: 100%; display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 2px; color: #fff; margin-bottom: 20px; text-transform: uppercase; }
    .status-text { font-size: 18px; margin-bottom: 20px; letter-spacing: 4px; }

    .neon-btn {
      --glow-color: rgb(190, 170, 0); --glow-spread-color: rgba(160, 140, 0, 0.4); --enhanced-glow-color: rgb(230, 210, 80); --btn-color: rgb(25, 25, 10);
      border: .15em solid var(--glow-color); padding: 1em 2em; color: var(--enhanced-glow-color); font-size: 13px; font-family: inherit; font-weight: bold;
      background-color: var(--btn-color); border-radius: 1em; outline: none; box-shadow: 0 0 0.8em .1em var(--glow-color), 0 0 2em 0.5em var(--glow-spread-color), inset 0 0 .5em .1em var(--glow-color);
      text-shadow: 0 0 .3em var(--glow-color); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s;
    }
    .neon-btn:hover:not(:disabled), .neon-btn.selected { color: var(--btn-color); background-color: var(--glow-color); box-shadow: 0 0 1em .2em var(--glow-color), 0 0 3em 1em var(--glow-spread-color), inset 0 0 .75em .25em var(--glow-color); }
    .neon-btn.hidden { visibility: hidden; pointer-events: none; }
    .neon-btn:disabled { filter: grayscale(100%); opacity: 0.3; cursor: not-allowed; }

    @keyframes btnFadeIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
    .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 100%; margin-bottom: 40px; }
    .options-grid .neon-btn, .controls .neon-btn { opacity: 0; }
    .controls { display: flex; gap: 30px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- Audio Elements -->
  <audio id="valve-audio" src="AUDIO/MSC-AUDIO/spinopel-open-an-air-pump-valve-411599.mp3" preload="auto"></audio>
  <audio id="target-audio" preload="auto"></audio>
  <audio id="playback-audio" preload="auto"></audio>

  <!-- Interaction Gate to fix browser autoplay restrictions -->
  <div id="start-overlay" onclick="launchGameEngine()">
    <span class="pulse-prompt">[ CLICK TO ENGAGE AUDIO TERMINAL ]</span>
  </div>

  <div class="cyber-matrix" id="matrix"></div>

  <!-- TRANSITION SCREEN -->
  <div id="transition-screen" class="screen">
    <div id="rain-container"></div>
    <div id="transition-content">
      <div style="display: flex; justify-content: center; align-items: center; width: 200px; height: 200px; position: relative;">
        <div id="valve-rim" class="original-valve">
          <div style="position: absolute; background: #ff0055; box-shadow: 0 0 10px #ff0055; top: 62px; left: -10px; width: 150px; height: 6px; transform: rotate(45deg);"></div>
          <div style="position: absolute; background: #ff0055; box-shadow: 0 0 10px #ff0055; top: 62px; left: -10px; width: 150px; height: 6px; transform: rotate(-45deg);"></div>
          <div style="position: absolute; top: 45px; left: 45px; width: 40px; height: 40px; background: #141424; border-radius: 50%; border: 2px solid #ff0055; box-shadow: 0 0 8px #ff0055; z-index: 2; display: flex; align-items: center; justify-content: center;">
            <div style="width: 10px; height: 10px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff;"></div>
          </div>
        </div>
      </div>
      <div id="transition-text">SYSTEM BOOTING...</div>
    </div>
  </div>

  <!-- MAIN GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div class="glass-container">
      <div class="status-bar">
        <span id="ui-round">Round: 1 / 6</span>
        <span id="ui-timer">Time: 120s</span>
        <span id="ui-hints">Hints: 3</span>
      </div>
      <div class="status-text" id="main-status">LISTENING TO GUARDIAN...</div>
      <div class="options-grid" id="options-grid"></div>
      <div class="controls">
        <button class="neon-btn" id="btn-hint" onclick="useHint()" disabled>System Hint</button>
        <button class="neon-btn" id="btn-submit" onclick="submitAnswer()" disabled>Confirm Input</button>
      </div>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="end-screen" class="screen">
    <div class="glass-container">
      <div class="status-text" style="font-size: 28px; color: #ffeb3b; text-shadow: 0 0 15px #ffeb3b; margin-bottom: 30px;">SEQUENCE COMPLETE</div>
      <div class="status-text" id="final-score" style="font-size: 18px; line-height: 1.8; text-transform: uppercase; letter-spacing: 2px;"></div>
      <button class="neon-btn" style="margin-top: 30px; opacity: 1;" onclick="location.reload()">Re-Initialize</button>
    </div>
  </div>

  <script>
    // Matrix Background Generation
    const matrixContainer = document.getElementById('matrix');
    const chars = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝᜀᜁᜂᜃᜄᜅᜆᜇᜈᜉᜊᜋᜌᜎᜏᜐᜑÁÂĂĐÊÍÔƠÚƯÝẮẰẲẴẶẤẦẨẪẬẾỀỂỄỆỐỒỔỖỘỚỜỞỠỢỨỪỬỮỰ".split('');
    const cols = Math.floor(window.innerWidth / 32);
    const rows = Math.floor(window.innerHeight / 32);
    let htmlStream = '';
    for (let i = 0; i < (cols * rows + 100); i++) {
      htmlStream += `<span>${chars[Math.floor(Math.random() * chars.length)]}</span>`;
    }
    matrixContainer.innerHTML = htmlStream;

    // Rain Generator for Transitions
    const rainContainer = document.getElementById('rain-container');
    const gods = ["アマテラス", "ᜊᜆ᜔ᜑᜎ", "LẠC LONG QUÂN", "단군", "玉皇大帝", "ZEUS"];
    const colors = ['color-cyan', 'color-magenta', 'color-white'];
    let rainInterval;

    function startRain() {
      rainContainer.innerHTML = '';
      rainInterval = setInterval(() => {
        const stream = document.createElement('div');
        stream.className = `rain-stream ${colors[Math.floor(Math.random() * colors.length)]}`;
        stream.style.left = `${Math.random() * 95}%`;
        stream.style.animationDuration = `${Math.random() * 4 + 4}s`;
        stream.innerText = `${gods[Math.floor(Math.random() * gods.length)]} // ${gods[Math.floor(Math.random() * gods.length)]}`;
        rainContainer.appendChild(stream);
        setTimeout(() => stream.remove(), 8000);
      }, 400);
    }

    // Audio Database
    const audioDB = [
      { file: 'AUDIO/TETO-AUDIO/A4@_Track2.wav', pitch: 69 },
      { file: 'AUDIO/TETO-AUDIO/A4_Track2.wav', pitch: 69 },
      { file: 'AUDIO/TETO-AUDIO/A5@_Track2.wav', pitch: 82 },
      { file: 'AUDIO/TETO-AUDIO/A5_Track2.wav', pitch: 81 },
      { file: 'AUDIO/TETO-AUDIO/B5_Track2.wav', pitch: 83 },
      { file: 'AUDIO/TETO-AUDIO/C5@_Track2.wav', pitch: 73 },
      { file: 'AUDIO/TETO-AUDIO/C5_Track2.wav', pitch: 72 },
      { file: 'AUDIO/TETO-AUDIO/C6_Track2.wav', pitch: 84 },
      { file: 'AUDIO/TETO-AUDIO/D4@_Track2.wav', pitch: 63 },
      { file: 'AUDIO/TETO-AUDIO/D5@_Track2.wav', pitch: 75 },
      { file: 'AUDIO/TETO-AUDIO/D5_Track2.wav', pitch: 74 },
      { file: 'AUDIO/TETO-AUDIO/E4_Track2.wav', pitch: 64 },
      { file: 'AUDIO/TETO-AUDIO/E5_Track2.wav', pitch: 76 },
      { file: 'AUDIO/TETO-AUDIO/E6_Track2.wav', pitch: 88 },
      { file: 'AUDIO/TETO-AUDIO/F4@_Track2.wav', pitch: 65 },
      { file: 'AUDIO/TETO-AUDIO/F4_Track2.wav', pitch: 65 },
      { file: 'AUDIO/TETO-AUDIO/F5@_Track2.wav', pitch: 78 },
      { file: 'AUDIO/TETO-AUDIO/F5_Track2.wav', pitch: 77 },
      { file: 'AUDIO/TETO-AUDIO/F6_Track2.wav', pitch: 89 },
      { file: 'AUDIO/TETO-AUDIO/G4@_Track2.wav', pitch: 67 },
      { file: 'AUDIO/TETO-AUDIO/G4_Track2.wav', pitch: 67 },
      { file: 'AUDIO/TETO-AUDIO/G5@_Track2.wav', pitch: 80 },
      { file: 'AUDIO/TETO-AUDIO/G5_Track2.wav', pitch: 79 }
    ];

    let currentRound = 1, score = 0, hintsRemaining = 3;
    let currentTarget = null, currentOptions = [], selectedOption = null;
    let roundTimerInterval = null, timeRemaining = 120;
    
    const targetAudio = document.getElementById('target-audio');
    const playbackAudio = document.getElementById('playback-audio');
    targetAudio.volume = 0.6;
    playbackAudio.volume = 0.6;

    const valveSound = document.getElementById('valve-audio');
    const valveRim = document.getElementById('valve-rim');
    const transitionText = document.getElementById('transition-text');

    function switchScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Triggered by the user click to bypass browser audio restrictions
    function launchGameEngine() {
      const overlay = document.getElementById('start-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 500);

      // Preload audio objects to force browser initialization
      targetAudio.load();
      playbackAudio.load();
      valveSound.load();

      runTransition(true, true);
    }

    function runTransition(isBoot, isCorrect) {
      switchScreen('transition-screen');
      startRain();
      valveSound.play().catch(e => console.log("Valve sound play error:", e));

      if (isBoot) {
        transitionText.innerText = "SYSTEM BOOTING...";
        valveRim.className = "original-valve";
      } else if (isCorrect) {
        transitionText.innerText = "VALVE CALIBRATED";
        valveRim.className = "original-valve";
      } else {
        transitionText.innerText = "PRESSURE ANOMALY";
        valveRim.className = "original-valve spin-jammed";
      }

      setTimeout(() => {
        clearInterval(rainInterval);
        initRound();
      }, 6000);
    }

    function initRound() {
      if (currentRound > 6) return endGame();
      
      document.getElementById('ui-round').innerText = `Round: ${currentRound} / 6`;
      document.getElementById('ui-hints').innerText = `Hints: ${hintsRemaining}`;
      document.getElementById('ui-timer').innerText = `Time: 120s`;
      
      setButtonsLocked(true);
      
      generateOptions();
      renderButtons();
      switchScreen('game-screen');
      
      let countdown = 3;
      document.getElementById('main-status').innerText = `GUARDIAN SYNC IN ${countdown}...`;
      
      const preTimer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          document.getElementById('main-status').innerText = `GUARDIAN SYNC IN ${countdown}...`;
        } else {
          clearInterval(preTimer);
          document.getElementById('main-status').innerText = "LISTENING TO GUARDIAN...";
          playTargetSequence(3);
        }
      }, 1000);
    }

    function setButtonsLocked(isLocked) {
      document.querySelectorAll('#options-grid .neon-btn').forEach(btn => btn.disabled = isLocked);
      document.getElementById('btn-hint').disabled = isLocked || hintsRemaining <= 0;
      document.getElementById('btn-submit').disabled = isLocked || !selectedOption;
    }

    function generateOptions() {
      currentTarget = audioDB[Math.floor(Math.random() * audioDB.length)];
      let validWrong = audioDB.filter(a => Math.abs(a.pitch - currentTarget.pitch) >= 2 && a.file !== currentTarget.file);
      validWrong = validWrong.sort(() => 0.5 - Math.random()).slice(0, 5);
      
      const rawOptions = [currentTarget, ...validWrong].sort(() => 0.5 - Math.random());
      
      currentOptions = rawOptions.map((opt, index) => {
        return {
          ...opt,
          label: `OPTION 0${index + 1}`
        };
      });

      selectedOption = null;
    }

    function renderButtons() {
      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';
      currentOptions.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'neon-btn';
        btn.innerText = option.label;
        btn.style.animation = `btnFadeIn 0.6s ease-out forwards`;
        btn.style.animationDelay = `${0.2 + (index * 0.1)}s`;
        btn.onclick = () => selectOption(btn, option);
        grid.appendChild(btn);
      });
      document.getElementById('btn-hint').style.animation = `btnFadeIn 0.6s ease-out forwards`;
      document.getElementById('btn-hint').style.animationDelay = `1.0s`;
      document.getElementById('btn-submit').style.animation = `btnFadeIn 0.6s ease-out forwards`;
      document.getElementById('btn-submit').style.animationDelay = `1.1s`;
    }

    function playTargetSequence(timesLeft) {
      if (timesLeft <= 0) {
        document.getElementById('main-status').innerText = "AWAITING INPUT...";
        setButtonsLocked(false);
        return startTimer();
      }
      targetAudio.src = currentTarget.file;
      targetAudio.play().catch(e => console.log("Target audio play blocked:", e));
      targetAudio.onended = () => setTimeout(() => playTargetSequence(timesLeft - 1), 1000);
    }

    function startTimer() {
      timeRemaining = 120;
      clearInterval(roundTimerInterval);
      roundTimerInterval = setInterval(() => {
        timeRemaining--;
        document.getElementById('ui-timer').innerText = `Time: ${timeRemaining}s`;
        if (timeRemaining <= 0) { clearInterval(roundTimerInterval); processGuess(false); }
      }, 1000);
    }

    function selectOption(btnElement, optionData) {
      document.querySelectorAll('#options-grid .neon-btn').forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');
      selectedOption = optionData;
      document.getElementById('btn-submit').disabled = false;
      playbackAudio.src = optionData.file;
      playbackAudio.play().catch(e => console.log("Playback audio play blocked:", e));
    }

    function useHint() {
      if (hintsRemaining <= 0) return;
      hintsRemaining--;
      document.getElementById('ui-hints').innerText = `Hints: ${hintsRemaining}`;
      document.getElementById('btn-hint').disabled = hintsRemaining <= 0;
      
      const grid = document.getElementById('options-grid');
      const visible = Array.from(grid.querySelectorAll('.neon-btn:not(.hidden)'));
      const incorrect = visible.filter(btn => currentOptions[Array.from(grid.children).indexOf(btn)].file !== currentTarget.file);
      
      for (let i = 0; i < 2 && i < incorrect.length; i++) {
        incorrect[i].classList.add('hidden');
        if (incorrect[i].classList.contains('selected')) {
           selectedOption = null;
           document.getElementById('btn-submit').disabled = true;
        }
      }
    }

    function submitAnswer() { if(selectedOption) processGuess(selectedOption.file === currentTarget.file); }

    function processGuess(isCorrect) {
      clearInterval(roundTimerInterval);
      playbackAudio.pause();
      targetAudio.pause();
      if (isCorrect) score++;
      currentRound++;
      runTransition(false, isCorrect);
    }

    function endGame() {
      switchScreen('end-screen');
      const hintsUsed = 3 - hintsRemaining;
      const finalCalculation = score - hintsUsed;
      const isPass = finalCalculation >= 3;
      
      document.getElementById('final-score').innerHTML = `
        Valves Calibrated: ${score} <br>
        Hint Penalty: -${hintsUsed} <br>
        <span style="font-size: 32px; font-weight: bold; color: ${isPass ? '#00ffcc' : '#ff0055'}; text-shadow: 0 0 15px ${isPass ? '#00ffcc' : '#ff0055'}; display: block; margin-top: 25px;">
          RESULT: ${isPass ? 'SYSTEM PASS' : 'SYSTEM FAIL'}
        </span>
      `;
    }
  </script>
</body>
</html>
